<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="ko-kr">
<head>
    <meta charset="UTF-8">
    <title>관리자 화면</title>
    <link rel="stylesheet" th:href="@{/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <script th:src="@{'/axios/1.7.4/dist/axios.min.js'}"></script>
    <script th:src="@{'/js/admin_viewAll.js'}" charset="UTF-8"></script>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f8f9fa;
}

.main_sect_pnl {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.table {
    border-collapse: collapse;
}

.table th, .table td {
    padding: 10px;
    text-align: center;
}

.table th {
    background-color: #343a40;
    color: white;
}

.table-hover tbody tr:hover {
    background-color: #f1f1f1;
}

.btn-primary {
    background-color: #007bff;
    border: none;
}

.btn-primary:hover {
    background-color: #0056b3;
}

.btn-danger {
    background-color: #dc3545;
    border: none;
}

.btn-danger:hover {
    background-color: #c82333;
}
</style>
</head>
<body>
    <div layout:fragment="content" class="main_sect_pnl">
        <div class="content_sect_pnl">
        
        <!-- (검색할) 회원 정보가 없을 경우 -->
			<div th:if="${#lists.isEmpty(members)}">

				<script>
					alert('검색 결과가 없습니다.')
				</script>

			</div>
			<!--// (검색할) 회원 정보가 없을 경우 -->

			<!-- (검색할) 회원 정보가 있을 경우 -->

			<!--
				인자 현황판 (collapse)
				: https://getbootstrap.com/docs/5.3/components/collapse/
			-->
			<div id="demo" class="collapse" th:if="${#lists.isEmpty(members) == false}">

				<table class="table table-sm table-striped">
					<tr>
					    <th style="width:150px;">총 인원 수</th><td th:text="${pageVO.listCount}"></td>
						<th style="width:150px;">이전 페이지</th><td th:text="${pageVO.previousPage}"></td>
						<th style="width:150px;">현재 페이지</th><td th:text="${pageVO.currentPage}"></td>
						<th style="width:150px;">이후 페이지</th><td th:text="${pageVO.nextPage}"></td>
						<th style="width:150px;">처음 페이지</th><td th:text="${pageVO.startPage}"></td>
						<th style="width:150px;">마지막 페이지</th><td th:text="${pageVO.endPage}"></td>
					</tr>
				</table>
			</div>
			<!-- 인자 현황판 끝 -->
        
            <h2 class="text-center mt-4">회원 관리</h2>

            <form th:action="@{/admin/seacrhAllWithRoles}" method="get" class="mb-4">
                <div class="row justify-content-center">
                    <div class="col-auto">
                        <select class="form-select" id="searchKey" name="searchKey">
                            <option selected value="id">아이디</option>
                            <option value="name">이름</option>
                            <option value="gender">성별</option>
                            <option value="email">이메일</option>
                            <option value="phone">휴대폰</option>
                            <option value="birthday">생일</option>
                            <option value="joindate">가입일</option>
                            <option value="role">등급(role)</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <input type="text" class="form-control" id="searchWord" name="searchWord" placeholder="검색어 입력" />
                    </div>
                    <div class="col-auto">
                        <button id="search_btn" class="btn btn-primary">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                    <div class="col-auto">
                        <a class="btn btn-secondary" th:href="@{/admin/viewAllWithRoles}">전체 회원 목록</a>
                    </div>
                </div>
            </form>

            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>번호</th>
                        <th>아이디</th>
                        <th>이름</th>
                        <th>성별</th>
                        <th>이메일</th>
                        <th>휴대폰</th>
                        <th>생일</th>
                        <th>가입일</th>
                        <th>등급(role)</th>
                        <th>&nbsp;</th>
                        <th>&nbsp;</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="member, st : ${members}">
                        <td th:text="${st.count + (pageVO.currentPage - 1) * 10}"></td>
                        <td th:utext="${member.get('ID')}"></td>
                        <td th:utext="${member.get('NAME')}"></td>
                        <td th:utext="${member.get('GENDER') == 'm' ? '남' : '여'}"></td>
                        <td th:utext="${member.get('EMAIL')}"></td>
                        <td>
                            <input type="text" th:value="${member.get('PHONE')}" readonly class="form-control" style="border: none;" />
                        </td>
                        <td th:utext="${#dates.format(member.get('BIRTHDAY'), 'yyyy년 MM월 dd일')}"></td>
                        <td th:utext="${#dates.format(member.get('JOINDATE'), 'yyyy년 MM월 dd일 HH:mm:ss')}"></td>
                        <td>
                            <div class="form-check">
                                <input type="radio" class="form-check-input"
                              			th:id="${'role1_' + member.get('ID')}"
                              			th:name="${'role1_' + member.get('ID')}" value="ROLE_USER"
										th:checked="${#strings.contains(member.get('ROLE'),'ROLE_USER')}" >
                                <label class="form-check-label">회원</label>
                                
                                <input type="radio" class="form-check-input"
                              			th:id="${'role2_' + member.get('ID')}"
                              			th:name="${'role1_' + member.get('ID')}" value="ROLE_ADMIN"
										th:checked="${#strings.contains(member.get('ROLE'),'ROLE_ADMIN')}" >
                                <label class="form-check-label">관리자</label>
                            </div>
                        </td>
                        <td>
                            <button type="button" th:id="${'role_update_btn_' + member.get('ID')}" 
                            		class="btn btn-sm btn-primary">수정</button>
                        </td>
                        
                        <td>
                        <button class="btn btn-sm btn-danger" 
                            		th:id="${'delete_btn' + member.get('ID')}">삭제</button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(members)}">
                        <td colspan="10" class="text-center"><b>검색된 회원 정보 없음</b></td>
                    </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-center mt-4">
                <nav aria-label="Page navigation">
                    <ul class="pagination">
                    
                    	<!-- 첫 페이지 -->
                        <li class="page-item">
                            <a class="page-link"
				      	 th:href="@{'/admin/seacrhAllWithRoles?currPage=1&searchKey='+${searchKey}+'&searchWord='+${searchWord}}" aria-label="Start">
				        <span aria-hidden="true">&Lt;</span>
                        </li>
                        
                        <!-- 이전 페이지 -->
                        <li class="page-item">
                            <a class="page-link" th:href="@{'/admin/viewAllWithRoles?currentPage=' + pageVO.previousPage}" aria-label="Previous">
                            <span aria-hidden="true">&lt;</span>
                        </li>
                        
                        <!-- 현재 페이지 -->
                        <li class="page-item active">
                            <a class="page-link" th:href="@{'/admin/viewAllWithRoles?currentPage=' + pageVO.currentPage}" th:utext="${pageVO.currentPage}"></a>
                        </li>
                        
                        <!-- 다음 페이지 -->
                        <li class="page-item">
                            <a class="page-link" th:href="@{'/admin/viewAllWithRoles?currentPage=' + pageVO.nextPage}" aria-label="Next">
                            <span aria-hidden="true">&gt;</span></a>
                        </li>
                        
                        <!-- 마지막 페이지 -->
                        <li class="page-item">
                            <a class="page-link" th:href="@{'/admin/viewAllWithRoles?currentPage=' + pageVO.endPage}" aria-label="End">
                            <span aria-hidden="true">&gt;</span></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>
