<!DOCTYPE html>
<html 	xmlns:th="http://www.thymeleaf.org"
	  	xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      	layout:decorate="~{layout}"
		lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>당뇨 식단</title>
     <link rel="stylesheet" th:href="@{/bootstrap/5.3.3/css/bootstrap.min.css}">
     <script th:src="@{'/axios/1.7.4/dist/axios.min.js'}"></script>

	<script th:inline="javascript">
	     var currentIndex = 0;
	     var menuItems = [[${menuItems}]];
	     console.log("menuItems:",menuItems);

	     // 좋아요 코드
	     function switchValues(id) {

	    	// "id"에서 id("" 제거)
	    	id = id.replaceAll('"','');
	    	console.log("id: ", id);

	    	console.log("Sending data:", { strId: id, foodMenu: menuItems[currentIndex], foodMenuIndex: currentIndex });

	    	// http://localhost:8181/healthyFoodProject/foodMenu/like?
	    	//		strId=abcd6666&foodMenu=%EC%9E%A1%EC%B1%84%EB%B0%A5%2C%EA%B3%A0%EB%93%B1%EC%96%B4%EC%A1%B0%EB%A6%BC_%EB%B0%B0%EC%B6%94%EA%B9%80%EC%B9%98%2C%EC%88%99%EC%A3%BC%EB%82%98%EB%AC%BC_%EC%88%99%EC%A3%BC_%EC%B1%84%EC%86%8C%2C%ED%94%8C%EB%9F%BC%EC%BD%94%ED%8A%B8_%EC%83%9D%EA%B2%83%2C%EC%BB%A4%ED%94%BC_%EB%94%94%EC%B9%B4%ED%8E%98%EC%9D%B8%EC%97%90%EC%8A%A4%ED%94%84%EB%A0%88%EC%86%8C%ED%95%AB%28HOT%29&
	    	//		foodMenuIndex=0

			//axios.get(`/healthyFoodProject/foodMenu/like?strId=${id}&foodMenu=${menuItems[currentIndex]}&foodMenuIndex=${currentIndex}`
	     	 axios({
	 			method : "post",
	 			url    : '/healthyFoodProject/foodMenu/like',
	 			data   : {strId : id, foodMenu : menuItems[currentIndex], foodMenuIndex: currentIndex},
	 			headers: {"Content-Type":'multipart/form-data'}
	 		 }).then(function(response) {
	 		//).then(function(response) {

	    			console.log("response.data : ", response.data);
	    			alert(response.data);

	    			// 오류 있을 때만 팝업으로 출력하도록 조치
	    			/* if (response.data === true) {
	    				msg = "새로운 회원의 초기 식단 데이터를 무사히 불러왔습니다.";

	    			} */

	    			// 화면 갱신 : refresh
	    			// location.reload();

	    		 	}).catch(function(err) {
	    			console.error("초기 식단 데이터를 불러오는 중 서버 에러가 발견되었습니다.");
	    		 });

	         currentIndex++;
	         if (currentIndex < menuItems.length) {
	         	document.getElementById('foodMenuOutput').innerHTML = menuItems[currentIndex];
	         } else {
	         	currentIndex = 0;
	         	document.getElementById('foodMenuOutput').innerHTML = menuItems[currentIndex];
	         }
	     };
	     
	     // 새로고침 코드
	     function switchValues2(id) {

		    	// "id"에서 id("" 제거)
		    	id = id.replaceAll('"','');
		    	console.log("id: ", id);

		    	console.log("Sending data:", { strId: id, foodMenu: menuItems[currentIndex], foodMenuIndex: currentIndex });

		     	 axios({
		 			method : "post",
		 			url    : '/healthyFoodProject/foodMenu/refresh',
		 			data   : {strId : id, foodMenu : menuItems[currentIndex], foodMenuIndex: currentIndex},
		 			headers: {"Content-Type":'multipart/form-data'}
		 		 }).then(function(response) {

		    			console.log("response.data : ", response.data);
		    			alert(response.data);

		    		 	}).catch(function(err) {
		    			console.error("초기 식단 데이터를 불러오는 중 서버 에러가 발견되었습니다.");
		    		 });

		         currentIndex++;
		         if (currentIndex < menuItems.length) {
		         	document.getElementById('foodMenuOutput').innerHTML = menuItems[currentIndex];
		         } else {
		         	currentIndex = 0;
		         	document.getElementById('foodMenuOutput').innerHTML = menuItems[currentIndex];
		         }
		     };
	
		     // 싫어요 코드
		     function switchValues3(id) {

			    	// "id"에서 id("" 제거)
			    	id = id.replaceAll('"','');
			    	console.log("id: ", id);

			    	console.log("Sending data:", { strId: id, foodMenu: menuItems[currentIndex], foodMenuIndex: currentIndex });

			     	 axios({
			 			method : "post",
			 			url    : '/healthyFoodProject/foodMenu/like',
			 			data   : {strId : id, foodMenu : menuItems[currentIndex], foodMenuIndex: currentIndex},
			 			headers: {"Content-Type":'multipart/form-data'}
			 		 }).then(function(response) {

			    			console.log("response.data : ", response.data);
			    			alert(response.data);

			    		 	}).catch(function(err) {
			    			console.error("초기 식단 데이터를 불러오는 중 서버 에러가 발견되었습니다.");
			    		 });

			         currentIndex++;
			         if (currentIndex < menuItems.length) {
			         	document.getElementById('foodMenuOutput').innerHTML = menuItems[currentIndex];
			         } else {
			         	currentIndex = 0;
			         	document.getElementById('foodMenuOutput').innerHTML = menuItems[currentIndex];
			         }
			     };

     </script>


      <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .meal-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .meal-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 300px;
            text-align: center;
            transition: transform 0.3s;
        }
        .meal-name {
            font-size: 1.5em;
            margin: 10px 0;
            color: #007bff;
        }
        .hidden {
            display: none; /* 숨김 클래스 */
        }
    </style>
</head>

<body>

<div layout:fragment="content">
    <h1>오늘의 식단</h1>

        <div class="meal-card">
            <div class="meal-name">A 식단</div>
            <!--  메뉴 에러 메세지 -->
            <div th:if="${msg}" class="alert alert-warning">
        	<p th:text="${msg}"></p>
    		</div>

            <div>
            	<p id="foodMenuOutput" th:text="${menuItems[0]}"></p>
            </div>
            <input 	type="submit"
					class="btn btn-primary"
					id="like"
					name="like"
					th:onclick="switchValues('[[${#authentication.name}]]')"
					value="좋아요"/>

			<input 	type="submit"
					class="btn btn-primary"
					id="refresh"
					name="refresh"
					th:onclick="switchValues2('[[${#authentication.name}]]')"
					value="새로고침"/>

			<input 	type="submit"
					class="btn btn-primary"
					id="dislike"
					name="dislike"
					th:onclick="switchValues3('[[${#authentication.name}]]')"
					value="싫어요"/>
        </div>



    <h1>AI 맞춤 식단</h1>
    <div class="meal-container">
        <div class="meal-card">
            <div class="meal-name">B 식단</div>
    </div>
    </div>
    </div>
</body>
</html>
