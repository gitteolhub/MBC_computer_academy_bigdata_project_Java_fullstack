<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout_login}"
      lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
<style>
        #wrap {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        
        }

        #login-box {
            width: 350px; 
            padding: 30px; 
            background: #fff; 
            border: 1px solid #000; 
            border-radius: 5px; 
        }
        button {
        	margin : 10px;
        	
        }
        	
    </style>
<!-- 로그인 에러 메시지 -->
<script th:inline="javascript" th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null}">

//captcha 이미지 리프레쉬(갱신) 함수
function refreshImage() {

	axios.get('refreshImage')
	  .then(function (response) {

		  console.log(response.data);

		  let json = response.data;

	      // 이미지 갱신
	      captcha_img.src = '/healthyFoodProject/captcha/image/' + json.captchaImage;

	      console.log("captchaImage : ", json.captchaImage);

	      // 키(key) 재입력
	      key.value = json.key;

	  })
	  .catch(function (error) {
	      console.log(error);
	  });
}

window.onload = function() {

	let submit_btn = document.getElementById("submit_btn");
	let key = document.getElementById("key");

	submit_btn.onclick = function() {

		let captchaVal = document.getElementById("captchaVal");

		alert(captchaVal.value);

		// const crossOriginIsolated = { withCredentials: true }

		// 입력값 검증 :
		// https://developers.naver.com/docs/utils/captcha/reference/#%EC%82%AC%EC%9A%A9%EC%9E%90-%EC%9E%85%EB%A0%A5%EA%B0%92-%EA%B2%80%EC%A6%9D-%EC%9A%94%EC%B2%AD
		// https://developers.naver.com/docs/utils/captcha/examples/
		axios.get('checkCaptcha', {
				 	params: {
				 		captchaVal : captchaVal.value,
						key : key.value
				    }
				  })
		  .then(function (response) {

			  console.log(response.data);
			  let json = response.data;
			  alert(json.result);

		  })
		  .catch(function (error) {
		      console.log(error);
		  });

		refreshImage();
		captchaVal.value = ""; // 입력 필드 초기화

	} //


	let refresh_btn = document.getElementById("refresh_btn");
	let captcha_img = document.getElementById("captcha_img");

	refresh_btn.onclick = refreshImage; // 그림 리프레쉬(갱신) 함수 호출

}//
</script>
</head>

<body>
	<div id="wrap" layout:fragment="content" class="main_sect_pnl">

		<!--
		<div th:if="${session.error == 'true'}" class="msg" th:text="${session.msg}"></div>

		<span th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null}"
			  th:text="${'메시지1 : ' + session.SPRING_SECURITY_LAST_EXCEPTION.message}">
		</span><br>

		<span th:if="${session.msg != null}" th:text="${'메시지2 : ' + session.msg.message}"></span><br>
	﻿	 -->

	<div id="login-box" class="border border-light-subtle border-5 rounded-4">
	<h2>Login Page</h2>
	<form id="loginForm"
			  name="loginForm"
			  th:action="@{'/loginForm'}"
			  method="POST">

			  <table class="table table-borderless">
					<tr>
						<td>
							<label for="username"
								   class="form-label mt-1">ID : </label>
						</td>
						<td class="ps-0">
							<input type="text"
								   class="form-control ms-0"
								   id = "userid"
								   name="userid"
								   required
								   pattern="[a-zA-Z]{1}\w{7,19}"
								   title="아이디는 영문자 및 숫자로 시작하여 8~20자 사이로 작성하여 주십시오" />
						</td>
					</tr>
					<tr>
						<td>
							<label for="password"
								   class="form-label mt-1">PW : </label>
						</td>
						<td class="ps-0">
							<input type="text"
								   class="form-control"
								   id="password"
								   name="password"
								   required
								   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*\W).{8,20}"
								   title="비밀변호는 영문 대소문자 및 숫자, 특수문자를 최소 1개 이상 포함하여 8~20 사이로 작성하여 주십시오." />
						</td>
					</tr>
					<tr>
						<td colspan="2">

							<div class="d-flex justify-content-evenly">

								<input type="submit"
									   class="btn btn-primary"
									   id="login"
									   name="login"
									   value="로그인"
									   />
								&nbsp;
								<input type="reset"
									   name="reset"
									   class="btn btn-primary"
									   value="취소" />
							    &nbsp;
							    <a th:href="@{/join}" class="btn btn-primary">회원가입</a>


						    </div>
						    
								<!-- 추후 hidden으로 변환할 것 -->
					<input type="text" class="form-control w-25 m-2" id="key" name="key" th:value="${key}" readonly />
				
					<hr>
				
					<div class="m-3" style="width:30vw">
				
						<div class="d-flex">
							<div>
								<img id="captcha_img" th:src="@{'/captcha/image/' + ${captchaImage}}">
							</div>
				
							<!-- 리프레쉬(refresh) 버튼 : captcha 서비스 재요청 -->
							<div class="pt-2 px-2" id="refresh_btn">
								<i class="bi bi-arrow-clockwise pt-2" style="font-size:3em"></i>
							</div>
						</div>
				
						<div class="d-flex row mt-2">
							<div class="col-8 pe-0">
								<input class="form-control" type="text" id="captchaVal" name="captchaVal" />
							</div>
							<div class="col-4 pe-0">
								<button class="btn btn-primary" type="button" id="submit_btn">전송</button>
							</div>
						</div>
					</div>
						</td>
					</tr>

					<!-- Naver & Google 로그인 링크 추가 -->
					<tr>
						<td colspan="2">
							<!-- 로그인이 안되었을 때 -->
							<div sec:authorize="isAnonymous()" class="row">

								<!-- Naver -->
								<div class="col-auto">
									<a th:href="@{'/oauth2/authorization/naver'}" class="btn btn-outline-primary mt-2">Naver Login</a>
								</div>

							           	<!-- Google -->
								<div class="col-auto">
									<a th:href="@{'/oauth2/authorization/google'}" class="btn btn-outline-primary mt-2">Google Login</a>
								</div>

							</div>
							<!--// 로그인이 안되었을 때 -->

						</td>
					</tr>
				</table>
			  </form>
		</div>
	</div>
</body>
</html>
