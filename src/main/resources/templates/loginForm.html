<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout_login}"
      lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
<style>
        #wrap {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;

        }

        #login-box {
            width: 350px;
            padding: 30px;
            background: #fff;
            border: 1px solid #000;
            border-radius: 5px;
        }
        button {
        	margin : 10px;

        }

</style>
    
<!-- 로그인 에러 메시지 -->
<script th:inline="javascript" th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null}">
//captcha 이미지 리프레쉬(갱신) 함수
function refreshImage() {
	
		
		axios.get('/healthyFoodProject/refreshImage')
		  .then(function (response) {
	
			  console.log(response.data);
	
			  let json = response.data;
	
		      // 이미지 갱신
		      captcha_img.src = '/healthyFoodProject/captcha/image/' + json.captchaImage;
	
		      console.log("captchaImage : ", json.captchaImage);
	
		      // 키(key) 재입력
		      key.value = json.key;
	
		  })
		  .catch(function (error) {
		      console.log(error);
		  });
		}

		window.onload = function() {
		    let submit_btn = document.getElementById("submit_btn");
		    let key = document.getElementById("key");
		    let refresh_btn = document.getElementById("refresh_btn");
		    let captcha_img = document.getElementById("captcha_img");
		    let captchaVal = document.getElementById("captchaVal");
		    let captchaResult = "false"; // 캡차 점검 여부
		
		    submit_btn.onclick = function() {
		        alert(captchaVal.value);
		        
		        let captchaFunc = () => {
		        	
		        	return axios.get('/healthyFoodProject/checkCaptcha', {
		        	
					            params: {
					                captchaVal: captchaVal.value,
					                key: key.value
					            }
					        })
					        .then(function(response) {
					            console.log('response.data :', response.data);
					            let json = response.data;
					            alert("수신 결과:"+json.result);
					            
						         refreshImage();
						         captchaVal.value = ""; // 입력 필드 초기화
					            
								return json.result; // 수신 결과(true/false)        
					        })
					        .catch(function(error) {
					            console.log(error);
					        });
		        	
		        	} // captchaFunc 끝
		        
		        	captchaResult = async () => {
			        	console.log("캡차 점검 여부1:", await captchaFunc());
			        }
			        
			        // captchaResult = wait();
					console.log("captchaResult:"+captchaResult);
					
			    } // submit_btn.onclick
		    
		    console.log("확인");
		    console.log("캡차 점검 여부2:"+captchaResult);
		    
		    refresh_btn.onclick = refreshImage; // 그림 리프레쉬(갱신) 함수 호출
			
		    if ([[${session.loginErrorCount}]] >= 3) {
		        document.getElementById("captcha-field").style.display = "block";
		    } else {
		        document.getElementById("captcha-field").style.display = "none";
		    }
		    
		    
		    
		    // 로그인 전송시
		    let loginForm = document.getElementById("loginForm");
		    loginForm.onsubmit = function(){
		    	console.log("로그인 전송");
		    	
				// 로그인 에러 카운트(loginErrorCount),캡차 점검 여부 확인
				// 로그인 3회 이상 틀렸을 때 : loginErrorCount >= 3 && captchㅁResult == true
				// 로그인 틀리지 않았을 때 : loginErrorCount == 0
				if ([[${session.loginErrorCount}]] < 3){
					console.log("전송");
				} else {
					
					return false;
				}
				
		    }//
		}
</script>
</head>

<body>
	<div id="wrap" layout:fragment="content" class="main_sect_pnl">

	<div id="login-box" class="border border-light-subtle border-5 rounded-4">
	<h2>Login Page</h2>
	<form id="loginForm"
			  name="loginForm"
			  th:action="@{'/loginForm'}"
			  method="POST">

			  <table class="table table-borderless">
					<tr>
						<td>
							<label for="username"
								   class="form-label mt-1">ID : </label>
						</td>
						<td class="ps-0">
							<input type="text"
								   class="form-control ms-0"
								   id = "userid"
								   name="userid"
								   required
								   pattern="[a-zA-Z]{1}\w{7,19}"
								   title="아이디는 영문자로 시작하여 8~20자 사이로 작성하여 주십시오" />
						</td>
					</tr>
					<tr>
						<td>
							<label for="password"
								   class="form-label mt-1">PW : </label>
						</td>
						<td class="ps-0">
							<input type="text"
								   class="form-control"
								   id="password"
								   name="password"
								   required
								   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*\W).{8,20}"
								   title="비밀번호는 영문 대소문자 및 숫자, 특수문자를 최소 1개 이상 포함하여 8~20 사이로 작성하여 주십시오." />
						</td>
					</tr>
					<tr>
						<td colspan="2">

				<!-- 캡차 시작 -->
				<!-- 캡차 key -->
				<input type="hidden" id="key" th:value="${key}">
				
				
		 		<div id = "captcha-field" style="display:none;">
				<div class="m-3" style="width:30vw">
					
					<div class="d-flex">
						<div>
							<!-- 캡차 이미지 노출 -->
							<img id="captcha_img" th:src="@{'/captcha/image/' + ${captchaImage}}">
						</div>

						<!-- 리프레쉬(refresh) 버튼 : captcha 서비스 재요청 -->
						<div class="pt-2 px-2" id="refresh_btn">
							<i class="bi bi-arrow-clockwise pt-2" style="font-size:3em"></i>
						</div>
					</div>

					<div class="d-flex row mt-2">
						<div class="col-8 pe-0">
							<!-- 캡차 텍스트 입력란 -->
							<input class="form-control" type="text" id="captchaVal" name="captchaVal" />
						</div>
						<!-- 캡차 전송 버튼 -->
						<div class="col-4 pe-0">
							<button class="btn btn-primary" type="button" id="submit_btn">캡차 전송</button>
						</div>
					</div>
				</div>
				</div>
					<!-- 캡챠 끝 -->

				<div class="d-flex justify-content-evenly">

								<input type="submit"
									   class="btn btn-primary"
									   id="login"
									   name="login"
									   value="로그인"
									   />
								&nbsp;
							    <a th:href="@{/join}" class="btn btn-primary">회원가입</a>

						    </div>

						</td>
					</tr>

					<!-- Naver & Google 로그인 링크 추가 -->
					<tr>
						<td colspan="2">
							<!-- 로그인이 안되었을 때 -->
							<div sec:authorize="isAnonymous()" class="row">

								<!-- Naver -->
								<div class="col-auto">
									<a th:href="@{'/oauth2/authorization/naver'}" class="btn btn-outline-primary mt-2">Naver Login</a>
								</div>

							           	<!-- Google -->
								<div class="col-auto">
									<a th:href="@{'/oauth2/authorization/google'}" class="btn btn-outline-primary mt-2">Google Login</a>
								</div>

							</div>
							<!--// 로그인이 안되었을 때 -->

						</td>
					</tr>
				</table>
			  </form>
		</div>
	</div>
</body>
</html>
