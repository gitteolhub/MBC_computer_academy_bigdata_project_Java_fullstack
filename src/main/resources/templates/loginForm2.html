<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout_login}"
      lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
<style>
        content {
            background-color: #f4f4f4; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        #login-box {
            width: 350px; 
            padding: 30px; 
            background: #fff; 
            border: 1px solid #000; 
            border-radius: 5px; 
        }
        button {
        	margin : 10px;
        	
        }
        	
    </style>
<!-- 로그인 에러 메시지 -->
<script th:inline="javascript" th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null}">
</script>
</head>

<body>
	<div id="wrap" layout:fragment="content" class="main_sect_pnl">

		<!--
		<div th:if="${session.error == 'true'}" class="msg" th:text="${session.msg}"></div>

		<span th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null}"
			  th:text="${'메시지1 : ' + session.SPRING_SECURITY_LAST_EXCEPTION.message}">
		</span><br>

		<span th:if="${session.msg != null}" th:text="${'메시지2 : ' + session.msg.message}"></span><br>
	﻿	 -->

	<div id="login-box" class="border border-light-subtle border-5 rounded-4">
	<h2>Login Page</h2>
	<form id="loginForm"
			  name="loginForm"
			  th:action="@{'/loginForm'}"
			  method="POST">

			  <table class="table table-borderless">
					<tr>
						<td>
							<label for="username"
								   class="form-label mt-1">ID : </label>
						</td>
						<td class="ps-0">
							<input type="text"
								   class="form-control ms-0"
								   id = "userid"
								   name="userid"
								   required
								   pattern="[a-zA-Z]{1}\w{7,19}"
								   title="아이디는 영문자 및 숫자로 시작하여 8~20자 사이로 작성하여 주십시오" />
						</td>
					</tr>
					<tr>
						<td>
							<label for="password"
								   class="form-label mt-1">PW : </label>
						</td>
						<td class="ps-0">
							<input type="text"
								   class="form-control"
								   id="password"
								   name="password"
								   required
								   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*\W).{8,20}"
								   title="비밀변호는 영문 대소문자 및 숫자, 특수문자를 최소 1개 이상 포함하여 8~20 사이로 작성하여 주십시오." />
						</td>
					</tr>
					<tr>
						<td colspan="2">

							<div class="d-flex justify-content-evenly">

								<input type="submit"
									   class="btn btn-primary"
									   id="login"
									   name="login"
									   value="로그인"
									   />
								&nbsp;
								<input type="reset"
									   name="reset"
									   class="btn btn-primary"
									   value="취소" />
							    &nbsp;
							    <a th:href="@{/join}" class="btn btn-primary">회원가입</a>

						    </div>
						</td>
					</tr>

					<!-- Naver & Google 로그인 링크 추가 -->
					<tr>
						<td colspan="2">
							<!-- 로그인이 안되었을 때 -->
							<div sec:authorize="isAnonymous()" class="row">

								<!-- Naver -->
								<div class="col-auto">
									<a th:href="@{'/oauth2/authorization/naver'}" class="btn btn-outline-primary mt-2">Naver Login</a>
								</div>

								<!-- Google -->
								<div class="col-auto">
									<a th:href="@{'/oauth2/authorization/google'}" class="btn btn-outline-primary mt-2">Google Login</a>
								</div>

							</div>
							<!--// 로그인이 안되었을 때 -->

						</td>
					</tr>
		<script>
        let loginAttempts = 0; // 로그인 시도 횟수
        let captchaVisible = false; // 캡챠 노출 여부

        function handleLogin(event) {
            event.preventDefault(); // 기본 폼 제출 방지

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // 여기에 실제 로그인 처리 로직 추가
            const isLoginSuccessful = mockLogin(username, password); // 모의 로그인 함수

            if (!isLoginSuccessful) {
                loginAttempts++;
                alert('로그인 실패!');

                if (loginAttempts >= 3 && !captchaVisible) {
                    showCaptcha();
                }
            } else {
                alert('로그인 성공!');
                // 로그인 성공 시 리다이렉션 로직 추가
            }
        }

        function mockLogin(username, password) {
            // 모의 로그인 로직 (예: 항상 실패)
            return false;
        }

        function showCaptcha() {
            captchaVisible = true; // 캡챠가 표시되었음을 기록
            document.getElementById('captcha').style.display = 'block';

            NaverCaptcha.init({
                clientId: 'YOUR_CLIENT_ID', // 네이버 클라이언트 ID
                onSuccess: function(response) {
                    // 캡챠 성공 시 처리
                    alert('캡챠 성공! 로그인 시도...');
                    // 추가적인 로그인 로직을 여기에 작성
                },
                onError: function(error) {
                    // 캡챠 오류 처리
                    alert('캡챠 오류 발생!');
                }
            });
        }
    </script>
				</table>
			  </form>
		</div>
	</div>

</body>
</html>
